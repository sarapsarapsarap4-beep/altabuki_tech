name: Build MyMart Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mymart_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mymart_app/pubspec.yaml

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        working-directory: mymart_app
        run: flutter pub get

      - name: Check Dart source files
        working-directory: mymart_app
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: mymart_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMart-Android-APK
          path: mymart_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
